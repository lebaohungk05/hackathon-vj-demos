[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ricebridge"
version = "0.1.0"
description = "RiceBridge Ops: an AI agent demo that schedules AWD irrigation for a shared pump and keeps per-field evidence for carbon credits."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "pandas>=2,<3",
    "Pillow>=10,<13",
]

[project.optional-dependencies]
sim = [
    "matplotlib>=3.7,<4",
    "requests>=2.31,<3",
]
test = [
    "playwright>=1.40,<2",
    "pytest>=8,<9",
]
dev = [
    "ricebridge[sim,test]",
    "ruff>=0.5",
]

[project.scripts]
ricebridge = "ricebridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ricebridge = ["web/**/*"]

[tool.ruff]
target-version = "py310"
line-length = 160
extend-exclude = ["outputs", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = [
    "E501",  # long lines are pre-existing; formatter is not enforced yet
    "E701", "E702", "E731", "E741",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "--import-mode=importlib"
markers = ["e2e: Playwright end-to-end checks (run tests/e2e/run_e2e.py)"]
