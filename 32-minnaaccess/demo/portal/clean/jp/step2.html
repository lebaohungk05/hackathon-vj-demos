<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ステップ2/3 – 請求内容</title>
<link rel="stylesheet" href="portal.css">
</head>
<body class="jp">
<header class="top"><div class="brand">みどり市 電子申請 <b>（模擬）</b></div><div class="note">MinnaAccess · 模擬サイト（実在の自治体ではありません）· 架空データ</div></header>
<main>
<h1>住民票の写し交付申請（模擬）</h1>
<ol class="steps"><li>1. 申請者</li><li class="on">2. 請求内容</li><li>3. 確認</li></ol>
<h2>ステップ2/3: 請求内容</h2>
<div class="field"><label for="tsusu">必要な通数</label><select id="tsusu"><option>1通</option><option>2通</option></select></div>
<div class="field"><label for="mokuteki">使用目的</label><select id="mokuteki"><option>就職手続き</option><option>運転免許</option><option>その他</option></select></div>
<div class="field"><label for="yubin">送付先の郵便番号</label><input id="yubin" type="text"></div>
<div class="field"><label for="denwa">日中の連絡先電話番号</label><input id="denwa" type="tel"></div>
<div class="field check"><input id="doui" type="checkbox"><label for="doui">記載内容に誤りがないことを誓約します</label></div>
<div class="actions"><button type="button" id="next2" class="btn" onclick="location.href='step3.html'">次へ</button></div>
<p class="foot">お問い合わせ: 0000-00-0000（模擬） · 試験用ページです。データはどこにも送信されません。</p>
</main>
</body>
</html>
