<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>MinnaAccess Live Demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="ui/dashboard.css">
<link rel="stylesheet" href="ui/deck-theme.css">
<link rel="icon" href="assets/lotus.svg" type="image/svg+xml">
</head>
<body>
<div class="app" id="app">
<header>
  <div class="brand"><img class="di-logo" src="assets/data-impact-logo.png" width="602" height="160" alt="Data Impact"><span class="brand-rule" aria-hidden="true"></span><h1 title="AI agent that walks e-government forms like a blind user" data-i18n-title="AI agent that walks e-government forms like a blind user">MinnaAccess</h1></div>
  <nav class="procs" id="procs" aria-label="Procedure" data-i18n-aria="Procedure"></nav>
  <div class="hdr-gap"></div>
  <div class="langs" id="langs" role="group" aria-label="Language"></div>
  <div class="modes" role="tablist" aria-label="Demo mode" data-i18n-aria="Demo mode"><button role="tab" id="modeReplay" data-mode="replay" aria-selected="true"><span data-i18n="Recorded">Recorded</span></button><button role="tab" id="modeLive" data-mode="live" aria-selected="false"><span class="dotlive" aria-hidden="true"></span><span data-i18n="Live">Live</span></button></div>
  <button type="button" class="detail-toggle" id="detailToggle" aria-expanded="false" aria-controls="drawer"><span aria-hidden="true">⋯</span><span data-i18n="Details">Details</span></button>
</header>
<aside class="drawer" id="drawer" aria-label="Details" data-i18n-aria="Details" hidden>
  <section class="dsec"><h4 data-i18n="Engine and answers">Engine and answers</h4><div class="dchips" id="hdr"></div></section>
  <section class="dsec" id="dStatusSec"><h4 data-i18n="Status">Status</h4><div class="dchips" id="dStatus"></div></section>
  <section class="dsec"><h4 data-i18n="Keyboard">Keyboard</h4><p class="hint" id="hint"></p><span class="play" id="playState"></span></section>
  <div class="dacts"><label class="dtoggle"><input type="checkbox" id="tlToggle"><span data-i18n="Show run timeline">Show run timeline</span></label><button type="button" class="ghost" id="resetAll"><span aria-hidden="true">↺</span><span data-i18n="Reset">Reset</span></button></div>
</aside>
<nav class="rail" id="rail" aria-label="Agent loop stages" data-i18n-aria="Agent loop stages"></nav>
<main id="main">
  <section class="left" aria-label="Mock portal under test" data-i18n-aria="Mock portal under test">
    <div class="viewer" id="viewer">
      <div class="chrome"><div class="dots" aria-hidden="true"><i></i><i></i><i></i></div><div class="url" id="url"></div><span class="mock" data-i18n="MOCK">MOCK</span><span class="tag" id="frameTag"></span></div>
      <div class="screen" id="screen"><img id="frame" alt="Mock portal page as the agent saw it" data-i18n-alt="Mock portal page as the agent saw it"></div>
    </div>
    <div class="caption" id="caption"><div class="who"><div class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div><span id="capWho" data-i18n="Screen reader">Screen reader</span></div><div class="sayw"><div class="said" id="said"></div><div class="gloss cap" id="gloss"></div></div><span class="meta" id="capMeta" hidden></span></div>
  </section>
  <section class="right" aria-label="What the agent does" data-i18n-aria="What the agent does">
    <div class="shead" id="shead"></div>
    <div class="panel" id="panel"></div>
    <div class="card tlc" id="tlCard"></div>
  </section>
</main>
<footer id="foot">
  <div class="foot-art" aria-hidden="true">
    <img class="vista vista-vn" src="assets/vista-vietnam.png" width="550" height="84" alt="">
    <img class="vista vista-jp" src="assets/vista-japan.png" width="472" height="153" alt="">
    <svg class="swoosh" viewBox="0 0 1000 60" preserveAspectRatio="none"><path class="band" d="M0 29C220 32 440 36 620 31C780 26 890 16 1000 5V60H0Z"/><path class="ribbon-red" d="M0 29C220 32 440 36 620 31C780 26 890 16 1000 5V-1.5C890 10.5 780 21.5 620 27C440 32.6 220 30 0 27.8Z"/><path class="ribbon-gold" d="M0 26.4C220 28.8 440 31.6 620 25.4C780 19.4 890 8.4 1000 -4" vector-effect="non-scaling-stroke"/></svg>
    <img class="lotus" src="assets/lotus.svg" width="220" height="170" alt="">
  </div>
  <div class="chapters" id="chapters"></div><div class="ticks" id="ticks"></div></footer>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="out/run_data.js"></script>
<script src="out_rule/run_data.js"></script>
<script src="i18n/translations.js"></script>
<script src="ui/strings.js"></script>
<script src="ui/i18n.js"></script>
<script src="ui/common.js"></script>
<script src="ui/art.js"></script>
<script src="ui/replay.js"></script>
<script src="ui/live.js"></script>
<script src="ui/main.js"></script>
<script src="ui/presentation.js"></script>
</body>
</html>
