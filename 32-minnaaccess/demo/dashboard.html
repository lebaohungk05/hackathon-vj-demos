</head>
<body>
<div class="deck-banner">
  <div class="deck-brand"><div class="deck-mark" aria-hidden="true">DI</div><div><div class="deck-overline">VIETNAM JAPAN AI HACKATHON 2026</div><div class="deck-title">MinnaAccess<span>Live Demo</span></div></div></div>
  <div class="country-pair" aria-label="Vietnam · Japan">
    <div class="country"><svg viewBox="0 0 60 40" role="img" aria-label="Vietnam"><path fill="#da251d" d="M0 0h60v40H0z"/><path fill="#ffdf00" d="m30 8 2.8 8.6h9L34.5 22l2.8 8.6-7.3-5.3-7.3 5.3 2.8-8.6-7.3-5.4h9z"/></svg><span>VIET NAM</span></div>
    <span class="country-link" aria-hidden="true">×</span>
    <div class="country"><svg viewBox="0 0 60 40" role="img" aria-label="Japan"><path fill="#fff" d="M0 0h60v40H0z"/><circle cx="30" cy="20" r="12" fill="#bc002d"/></svg><span>JAPAN</span></div>
  </div>
<svg class="partnership-map" viewBox="0 0 240 100" role="img" aria-label="Vietnam and Japan connected, schematic map">
<g class="map-grid" fill="none" stroke="currentColor" opacity=".12"><ellipse cx="120" cy="50" rx="114" ry="44"/><ellipse cx="120" cy="50" rx="74" ry="44"/><path d="M12 35h216M12 65h216M120 6v88"/></g>
<g class="map-land" fill="currentColor" stroke="currentColor" stroke-linejoin="round">

</g>
<path class="map-route" d="M67 52Q103 3 167 48" fill="none" stroke-width="1.6" stroke-dasharray="3 4"/>
<g class="map-point"><circle cx="67" cy="52" r="3"/><circle cx="167" cy="48" r="3"/></g>
<g fill="currentColor" font-family="Inter,Segoe UI,sans-serif" font-weight="700" font-size="8" letter-spacing="1"><text x="17" y="96">VIET NAM</text><text x="193" y="44">JAPAN</text></g>
</svg>
  <div class="deck-credit">DATA IMPACT · VN × JP</div>
</div>
<div class="vjline" aria-hidden="true"></div>
<div class="app" id="app">
<header>
  <div class="brand"><div class="logo" aria-hidden="true">M</div><div><h1>MinnaAccess</h1><small data-i18n="AI agent that walks e-government forms like a blind user">AI agent that walks e-government forms like a blind user</small></div></div>
  <nav class="procs" id="procs" aria-label="Procedure" data-i18n-aria="Procedure"></nav>
  <div class="hdr-right" id="hdr"></div>
  <div class="langs" id="langs" role="group" aria-label="Language"></div>
  <div class="modes" role="tablist" aria-label="Demo mode" data-i18n-aria="Demo mode"><button role="tab" id="modeReplay" data-mode="replay" aria-selected="true"><span data-i18n="Recorded run">Recorded run</span></button><button role="tab" id="modeLive" data-mode="live" aria-selected="false"><span class="dotlive" aria-hidden="true"></span><span data-i18n="Live run">Live run</span></button></div>
</header>
<nav class="rail" id="rail" aria-label="Agent loop stages" data-i18n-aria="Agent loop stages"></nav>
<main id="main">
  <section class="left" aria-label="Mock portal under test" data-i18n-aria="Mock portal under test">
    <div class="viewer" id="viewer">
      <div class="chrome"><div class="dots" aria-hidden="true"><i></i><i></i><i></i></div><div class="url" id="url"></div><span class="mock" data-i18n="MOCK">MOCK</span><span class="tag" id="frameTag"></span></div>
      <div class="screen" id="screen"><img id="frame" alt="Mock portal page as the agent saw it" data-i18n-alt="Mock portal page as the agent saw it"></div>
    </div>
    <div class="caption" id="caption"><div class="who"><div class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div><span id="capWho" data-i18n="Screen reader">Screen reader</span></div><div class="sayw"><div class="said" id="said"></div><div class="gloss cap" id="gloss"></div></div><span class="meta" id="capMeta"></span></div>
  </section>
  <section class="right" aria-label="What the agent does" data-i18n-aria="What the agent does">
    <div class="shead" id="shead"></div>
    <div class="panel" id="panel"></div>
    <div class="card tlc" id="tlCard"></div>
  </section>
</main>
<footer id="foot"><div class="prog"><i id="progBar"></i></div><div class="chapters" id="chapters"></div><div class="ticks" id="ticks"></div><span class="play" id="playState"></span><span class="hint" id="hint"></span></footer>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="ui/presentation.js"></script>
</body>
</html>
